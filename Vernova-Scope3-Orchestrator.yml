    - data:
        code: "def main(hours: float, weight: float, material_factor: float, capacity_mw:\
          \ float, h2_blend_pct: float) -> dict:\n    # Convert input tokens to standard\
          \ Python floats\n    try:\n        runtime = float(hours)\n        mass\
          \ = float(weight)\n        material_factor = float(material_factor)\n  \
          \      capacity_mw = float(capacity_mw)\n        h2_blend_pct = float(h2_blend_pct)\n\
          \    except (ValueError, TypeError):\n        return {\"result\": \"ERROR:\
          \ Input data streams are corrupted or unreadable text. Cannot compute strategy.\"\
          }\n\n    # \U0001F6D1 CRITICAL EDGE CASE INSURANCE: Catch negative or impossible\
          \ inputs\n    if runtime < 0 or mass < 0:\n        return {\n          \
          \  \"result\": f\"CRITICAL WARNING: Invalid physical data entered (Hours:\
          \ {runtime}, Weight: {mass}kg, Material Factor: {material_factor}, capacity_mw:\
          \ {capacity_mw} MW, h2_blend_pct: {h2_blend_pct}). \"\n                \
          \      f\"Industrial supply chains cannot process negative materials or\
          \ negative runtimes. \"\n                      f\"GE Vernova alignment calculation\
          \ halted for compliance safety.\"\n        }\n    \n    if runtime == 0\
          \ and mass == 0:\n        return {\"result\": \"SYSTEM NOTICE: Runtimes\
          \ and material masses are set to zero. Current value chain carbon footprint\
          \ is baseline zero. GE Vernova is technically compliant, but no operational\
          \ data was provided to simulate.\"}\n\n    # Standard Math Execution (Only\
          \ runs if inputs pass the validation checks above)\n    upstream_footprint\
          \ = (mass * material_factor) / 1000.0\n    total_mwh_generated = hours *\
          \ capacity_mw\n    #downstream_footprint = runtime  * capacity_mw\n    baseline_fuel_intensity_mwh\
          \ = 380.0 \n    \n    # Calculate a non-linear carbon abatement curve factor\
          \ matching GE Verno\n    if h2_blend_pct >= 100.0:\n        abatement_factor\
          \ = 0.0 # Zero emissions at 100% H2\n    elif h2_blend_pct >= 75.0:\n  \
          \      abatement_factor = 0.50 # 50% reduction\n    elif h2_blend_pct >=\
          \ 50.0:\n        abatement_factor = 0.78 # 22% reduction\n    elif h2_blend_pct\
          \ >= 25.0:\n        abatement_factor = 0.90 # 10% reduction\n    else:\n\
          \        abatement_factor = 1.0 # No abatement (Pure Natural Gas)\n    \n\
          \    downstream_footprint = (total_mwh_generated * (baseline_fuel_intensity_mwh\
          \ / 1000.0)) * abatement_factor\n\n    total_scope3 = upstream_footprint\
          \ + downstream_footprint\n\t# Change the safety limit threshold from 5000.0\
          \ to 3500.0\n    safety_threshold_tons = 3500.0\n    on_track = \"YES\"\
          \ if total_scope3 <= safety_threshold_tons else \"NO\"\n    \n    return\
          \ {\n        \"result\": f\"Upstream Footprint: {upstream_footprint:,.2f}\
          \ tons CO2e. Downstream Footprint: {downstream_footprint:,.2f} tons CO2e.\
          \ Total Value Chain Trajectory: {total_scope3:,.2f} tons CO2e. Is GE Vernova\
          \ on track for 2050 targets? {on_track}.\"\n    }"
